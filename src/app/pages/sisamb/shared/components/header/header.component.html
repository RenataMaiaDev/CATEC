<header class="header" [class.menu-open]="isMenuOpen()">
  <div class="header-container">
    <!-- Logo -->
    <a
      href="#sisamb-inicio"
      class="logo"
      (click)="setActiveSection('sisamb-inicio', $event)"
    >
      <img src="img/logo-sisamb.webp" alt="SISAMB" class="logo-img" />
    </a>

    <!-- Navigation Menu Desktop -->
    <nav class="nav-menu">
      <a
        href="#sisamb-inicio"
        class="nav-link"
        [class.active]="activeSection() === 'sisamb-inicio'"
        (click)="setActiveSection('sisamb-inicio', $event)"
        >INÍCIO</a
      >

      <a
        href="#sisamb-sobre"
        class="nav-link"
        [class.active]="activeSection() === 'sisamb-sobre'"
        (click)="setActiveSection('sisamb-sobre', $event)"
        >SOBRE</a
      >

      <a
        href="#sisamb-problema"
        class="nav-link"
        [class.active]="activeSection() === 'sisamb-problema'"
        (click)="setActiveSection('sisamb-problema', $event)"
        >A realidade sem o SISAMB</a
      >

      <a
        href="#sisamb-modulos"
        class="nav-link"
        [class.active]="activeSection() === 'sisamb-modulos'"
        (click)="setActiveSection('sisamb-modulos', $event)"
        >MÓDULOS</a
      >

      <a
        href="#sisamb-contratar"
        class="nav-link"
        [class.active]="activeSection() === 'sisamb-contratar'"
        (click)="setActiveSection('sisamb-contratar', $event)"
        >COMO CONTRATAR</a
      >

      <!-- SISAMB login link, styled like the other nav items -->
      <a
        href="https://sisamb.eco.br/auth/login"
        target="_blank"
        rel="noopener noreferrer"
        class="nav-link"
      >
        <i class="fa-solid fa-right-to-bracket"></i>
        <span>ACESSAR O SISAMB</span>
      </a>
    </nav>

    <!-- Mobile Hamburger Button -->
    <button
      class="hamburger-btn"
      (click)="toggleMenu()"
      aria-label="Menu de navegação"
    >
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

    <!-- Expanded Mobile Menu -->
    <div class="mobile-menu">
      <nav class="mobile-nav">
        <a
          href="#sisamb-inicio"
          class="mobile-link"
          (click)="setActiveSection('sisamb-inicio', $event)"
          >INÍCIO</a
        >
        <a
          href="#sisamb-sobre"
          class="mobile-link"
          (click)="setActiveSection('sisamb-sobre', $event)"
          >SOBRE</a
        >
        <a
          href="#sisamb-problema"
          class="mobile-link"
          (click)="setActiveSection('sisamb-problema', $event)"
          >A realidade sem o SISAMB</a
        >
        <a
          href="#sisamb-modulos"
          class="mobile-link"
          (click)="setActiveSection('sisamb-modulos', $event)"
          >MÓDULOS</a
        >
        <a
          href="#sisamb-contratar"
          class="mobile-link"
          (click)="setActiveSection('sisamb-contratar', $event)"
          >COMO CONTRATAR</a
        >
        <!-- SISAMB login link (mobile, same style) -->
        <a
          href="https://sisamb.eco.br/auth/login"
          target="_blank"
          rel="noopener noreferrer"
          class="mobile-link"
        >
          <span>ACESSAR O SISAMB</span>
          <i class="fa-solid fa-right-to-bracket"></i>
        </a>
      </nav>
    </div>
  </div>
</header>
