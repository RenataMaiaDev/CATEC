<section class="more-products-section" id="tonomei-vantagens">
  <div class="section-container text-center">
    <!-- Cabeçalho -->
    <span class="section-badge">Conheça as Vantagens</span>
    <h2 class="section-title">
      Um jeito novo de cuidar de <span class="highlight">você</span> e de
      seu negócio.
    </h2>
    <p class="section-subtitle">
      Conheça algumas das funções que vai ajudar você na sua rotina diária.
      Tudo que precisa num só lugar e que esteja na palma de sua mão de
      forma fácil, intuitiva, moderna e organizada.
    </p>

    <!-- Grid de Funcionalidades -->
    <div class="features-grid" #featuresGrid>
      <app-card
        icon="receipt_long"
        title="Emissão e controle DAS"
        description="Gerenciamos suas guias automaticamente. Sem risco, sem multas, sem atrasos."
      >
      </app-card>

      <app-card
        icon="description"
        title="Declaração anual simplificada"
        description="Cumpra a DASN-SIMEI direto pela plataforma, sem depender de terceiros."
      >
      </app-card>

      <app-card
        icon="inventory_2"
        title="Controle de estoque"
        description="Cadastre seus produtos e serviços e mantenha controle total de seus estoques e prazos de validade."
      >
      </app-card>

      <app-card
        icon="storefront"
        title="Vitrine integrada"
        description="Aqui você será visto, novos clientes, novos mercados, mais negócios para dentro de sua empresa."
      >
      </app-card>

      <app-card
        icon="account_balance_wallet"
        title="Gestão de gastos"
        description="Registre, acompanhe e descubra como o gerenciamento dos seus gastos agora ficou mais fácil e inteligente."
      >
      </app-card>

      <app-card
        icon="school"
        title="Trilha do conhecimento"
        description="Aqui, de qualquer lugar, você pode fazer seu curso, seu treinamento e melhorar ainda mais seu negócio."
      >
      </app-card>

      <app-card
        icon="verified"
        title="Validação de documentos"
        description="A ferramenta tônomei analisa e valida seus documentos, ou seja, sua validade, sua origem e demais itens de segurança."
      >
      </app-card>

      <app-card
        icon="event"
        title="Feiras e eventos"
        description="Permite que você tenha acesso as feiras e eventos para vender seus produtos e serviços através de uma reserva simples e descomplicada."
      >
      </app-card>

      <app-card
        icon="point_of_sale"
        title="Sistema de vendas integrado"
        description="Registre seus pedidos e acompanhe todas as suas vendas em um único lugar, direto pela plataforma."
      >
      </app-card>
    </div>

    <!-- Botão Principal -->
    <div class="more-products-actions">
      <app-tonomei-button
        variant="primary"
        (click)="
          navigateTo('https://backendjava.catecsolucoes.com.br/tonomei/demo')
        "
      >
        Crie sua Conta Aqui!
        <i class="fa-solid fa-arrow-right"></i>
      </app-tonomei-button>
    </div>
  </div>
</section>
