<section class="hero-section" id="inicio">
  <div class="hero-container">
    <!-- Left side: Text and CTAs -->
    <div class="hero-content">
      <h1 class="hero-title">
        Soluções inteligentes <br />
        <span class="highlight">para uma gestão mais eficiente</span>
      </h1>
      <p class="hero-subtitle">
        Nos relacionamos com soluções modernas, integradas, acessíveis e
        intuitivas. Sensibilidade faz parte de nosso DNA. Ajudar nossos
        clientes, parceiros e amigos é nossa cultura e fazemos isso de onde
        você estiver.
      </p>

      <div class="hero-actions">
        <app-button variant="primary" (click)="abrirOrcamento()">
          Fale Conosco <i class="fa-solid fa-arrow-right"></i>
        </app-button>
      </div>
    </div>

    <!-- Right side: Main image -->
    <div class="hero-image-wrapper">
      <img
        src="img/hero.png"
        alt="CATEC Soluções Tecnológicas"
        class="hero-img"
      />
    </div>
  </div>

  <!-- Floating card of differentiators, built from the reusable components -->
  <div class="hero-features-container">
    <div class="hero-features-card" #featuresCard>
      <!-- Card 1: focused on efficiency and real productivity -->
      <app-card
        icon="auto_mode"
        title="Gestão automatizada"
        description="Elimine tarefas manuais lentas com ferramentas inteligentes desenhadas para dar velocidade ao seu dia a dia."
      >
      </app-card>

      <!-- Card 2: focused on financial return and competitiveness -->
      <app-card
        icon="trending_up"
        title="Alta performance"
        description="Acesse o mesmo nível de tecnologia das grandes corporações por um investimento proporcional à sua realidade."
      >
      </app-card>

      <!-- Card 3: focused on trust and premium support -->
      <app-card
        icon="handshake"
        title="Suporte humanizado"
        description="Esqueça robôs e respostas prontas. Tenha um time de especialistas pronto para resolver seus problemas de ponta a ponta."
      >
      </app-card>
    </div>
  </div>
</section>
