<header class="header" [class.menu-open]="isMenuOpen()">
  <div class="header-container">
    <a href="#" class="logo" (click)="setActiveSection('inicio', $event)">
      <img
        src="img/logo-catec-solucoes.png"
        alt="CATEC Soluções"
        class="logo-img"
      />
    </a>

    <!-- Navigation Menu Desktop -->
    <nav class="nav-menu">
      <a
        href="#inicio"
        class="nav-link"
        [class.active]="activeSection() === 'inicio'"
        (click)="setActiveSection('inicio', $event)"
        >INÍCIO</a
      >

      <a
        href="#quem-somos"
        class="nav-link"
        [class.active]="activeSection() === 'quem-somos'"
        (click)="setActiveSection('quem-somos', $event)"
        >QUEM SOMOS</a
      >

      <a
        href="#produto"
        class="nav-link"
        [class.active]="activeSection() === 'produto'"
        (click)="setActiveSection('produto', $event)"
        >SOLUÇÕES EM DESTAQUE</a
      >

      <a
        href="#outros-servicos"
        class="nav-link"
        [class.active]="activeSection() === 'outros-servicos'"
        (click)="setActiveSection('outros-servicos', $event)"
        >NOSSOS SERVIÇOS</a
      >

      <!-- Dropdown Item -->
      <div class="dropdown-container" [class.open]="isDropdownOpen()">
        <button
          class="nav-link dropdown-toggle"
          [class.active]="
            ['portal', 'suporte', 'transparencia'].includes(activeSection())
          "
          (click)="toggleDropdown($event)"
        >
          LINKS ÚTEIS
          <i class="fa-solid fa-chevron-down arrow-icon"></i>
        </button>
        <div class="dropdown-menu">
          <a
            href="#portal"
            class="dropdown-item"
            (click)="setActiveSection('portal', $event)"
            >Portal do Cliente</a
          >
          <a
            href="#suporte"
            class="dropdown-item"
            (click)="setActiveSection('suporte', $event)"
            >Suporte Técnico</a
          >
          <a
            href="#transparencia"
            class="dropdown-item"
            (click)="setActiveSection('transparencia', $event)"
            >Portal da Transparência</a
          >
        </div>
      </div>
    </nav>

    <!-- Botão Hambúrguer Mobile -->
    <button
      class="hamburger-btn"
      (click)="toggleMenu()"
      aria-label="Menu de navegação"
    >
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

    <!-- Menu Mobile Expandido -->
    <div class="mobile-menu">
      <nav class="mobile-nav">
        <a
          href="#inicio"
          class="mobile-link"
          (click)="setActiveSection('inicio', $event)"
          >INÍCIO</a
        >
        <a
          href="#quem-somos"
          class="mobile-link"
          (click)="setActiveSection('quem-somos', $event)"
          >QUEM SOMOS</a
        >
        <a
          href="#produto"
          class="mobile-link"
          (click)="setActiveSection('produto', $event)"
          >SOLUÇÕES EM DESTAQUE</a
        >
        <a
          href="#outros-servicos"
          class="mobile-link"
          (click)="setActiveSection('outros-servicos', $event)"
          >NOSSOS SERVIÇOS</a
        >

        <div class="mobile-dropdown" [class.open]="isDropdownOpen()">
          <button
            class="mobile-link mobile-dropdown-toggle"
            (click)="toggleDropdown($event)"
          >
            LINKS ÚTEIS <i class="fa-solid fa-chevron-down arrow-icon"></i>
          </button>
          <div class="mobile-dropdown-menu">
            <a
              href="#portal"
              class="mobile-dropdown-item"
              (click)="setActiveSection('portal', $event)"
              >Portal do Cliente</a
            >
            <a
              href="#suporte"
              class="mobile-dropdown-item"
              (click)="setActiveSection('suporte', $event)"
              >Suporte Técnico</a
            >
            <a
              href="#transparencia"
              class="mobile-dropdown-item"
              (click)="setActiveSection('transparencia', $event)"
              >Portal da Transparência</a
            >
          </div>
        </div>
      </nav>
    </div>
  </div>
</header>
