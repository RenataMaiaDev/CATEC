<section class="cta-final-section" id="gestao-contato">
  <div class="cta-final-content">
    <h2 class="cta-final-title">
      Pronto para centralizar a gestão da sua instituição?
    </h2>
    <p class="cta-final-subtitle">
      Fale com a gente pelo WhatsApp e veja como o Gestão Una pode ajudar.
    </p>

    <app-gestao-button
      variant="primary"
      class="cta-final-button"
      (click)="abrirWhatsApp()"
    >
      <i class="fa-brands fa-whatsapp"></i>
      Conversar agora pelo WhatsApp
    </app-gestao-button>

    <p class="cta-final-note">
      Resposta rápida · Atendimento dedicado · Sem compromisso
    </p>
  </div>
</section>
