<section class="more-products-section" id="outros-servicos">
  <div class="section-container text-center">
    <!-- Cabeçalho -->
    <span class="section-badge">Nossos Serviços</span>
    <h2 class="section-title">
      Tecnologia e Consultoria para o seu
      <span class="highlight">Crescimento</span>
    </h2>
    <p class="section-subtitle">
      Além do Tônomei, oferecemos um portfólio completo de assessoria
      especializada para transformar a gestão do seu negócio ou órgão público.
    </p>

    <!-- Grid 2x2 (2 em cima, 2 embaixo) -->
    <div class="products-grid">
      <!-- Linha 1 - Card 1 -->
      <app-card
        icon="terminal"
        title="Desenvolvimento de Soluções Tecnológicas"
        description="Melhoramos a logística com soluções personalizadas, de softwares de rastreamento a sistemas de gestão de inventário, garantindo total controle."
      >
      </app-card>

      <!-- Linha 1 - Card 2 -->
      <app-card
        icon="account_balance"
        title="Assessoria para Gestão Pública"
        description="Análises econômicas especializadas para embasar decisões estratégicas no setor público, fornecendo orientações valiosas para projetos."
      >
      </app-card>

      <!-- Linha 2 - Card 3 -->
      <app-card
        icon="analytics"
        title="Assessoria Econômica para Gestão Pública"
        description="Especialistas em análise econômica e planejamento financeiro para fornecer insights precisos voltados à otimização dos recursos públicos."
      >
      </app-card>

      <!-- Linha 2 - Card 4 -->
      <app-card
        icon="find_replace"
        title="Atualização de NCM"
        description="Garantimos conformidade e precisão nas atualizações regulares de NCM, mantendo sua empresa em dia com as classificações fiscais de mercadorias."
      >
      </app-card>
    </div>

    <!-- Botão Principal de Orçamento -->
    <div class="more-products-actions">
      <app-button variant="primary" (click)="openWhatsApp()">
        Solicitar Orçamento Personalizado
        <i class="fa-solid fa-arrow-right"></i>
      </app-button>
    </div>
  </div>
</section>
