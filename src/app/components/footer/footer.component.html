<footer class="footer" [ngClass]="'footer--' + theme">
  <div class="footer-container">
    <div class="footer-top">
      <img
        src="img/logo-catec-solucoes1.png"
        alt="CATEC Soluções"
        class="footer-logo"
      />

      <div class="footer-contact">
        <a
          class="footer-item"
          [href]="whatsappUrl"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="fa-brands fa-whatsapp"></i>
          <span>(00) 0 0000-0000</span>
        </a>

        <a class="footer-item" href="mailto:contato&#64;suaempresa.com.br">
          <i class="fa-solid fa-envelope"></i>
          <span>contato&#64;suaempresa.com.br</span>
        </a>

        <span class="footer-item">
          <i class="fa-solid fa-location-dot"></i>
          <span>Cidade, Estado</span>
        </span>
      </div>
    </div>

    <div class="footer-divider"></div>

    <div class="footer-bottom">
      <p class="footer-copy">
        © {{ currentYear }} {{ brandName }} · Todos os direitos reservados.
      </p>

      <div class="footer-links">
        <a href="#" (click)="$event.preventDefault()">Termos de Uso</a>
        <span class="footer-sep">|</span>
        <a href="#" (click)="$event.preventDefault()">Privacidade</a>
      </div>
    </div>
  </div>
</footer>
