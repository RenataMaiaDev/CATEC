<section class="processos-section">
  <p class="processos-label">Processos suportados pela plataforma</p>

  <div class="marquee">
    <div class="marquee-track">
      @for (item of processosLoop; track $index) {
        <span class="marquee-pill" [attr.aria-hidden]="$index >= processos.length ? 'true' : null">
          <span class="material-icons">check_circle</span>
          {{ item }}
        </span>
      }
    </div>
  </div>
</section>
