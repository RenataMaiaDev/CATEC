<section class="acesso-section">
  <div class="acesso-card">
    <span class="material-icons acesso-icon">public</span>
    <h2 class="acesso-title">Acesse a plataforma</h2>
    <p class="acesso-description">
      Equipes da secretaria, fiscais, gestores e cidadãos podem acessar o
      Sisamb.eco direto pelo link abaixo. Tudo no navegador, sem precisar
      instalar nada.
    </p>

    <div class="acesso-url-box">
      <span class="acesso-url-label">Endereço da plataforma</span>
      <span class="acesso-url">www.sisamb.eco.br</span>
    </div>

    <app-sisamb-button variant="primary" (click)="acessarPlataforma()">
      Acessar a plataforma <i class="fa-solid fa-arrow-up-right-from-square"></i>
    </app-sisamb-button>
  </div>
</section>
