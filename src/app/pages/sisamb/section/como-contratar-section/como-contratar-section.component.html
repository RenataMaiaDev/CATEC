<section class="contratar-section" id="sisamb-contratar">
  <div class="contratar-container">
    <!-- Badge sits above everything in the section -->
    <span class="section-badge section-badge--sisamb">Como contratar</span>

    <div class="contratar-row">
      <!-- Left: intro text -->
      <div class="contratar-intro">
        <h2 class="section-title section-title--sisamb intro-title">
          Do primeiro contato ao
          <span class="highlight">sistema funcionando</span>
        </h2>

        <span class="intro-divider" aria-hidden="true"></span>

        <p class="section-subtitle intro-subtitle">
          Nunca foi tão fácil ter o Sisamb.Eco junto a você.
        </p>

        <img
          src="images/sisamb.webp"
          alt="Sisamb.Eco"
          class="intro-image"
          loading="lazy"
        />
      </div>

      <!-- Right: vertical timeline — the real hiring process, one card per step -->
      <div class="passos-timeline" #timeline>
        @for (passo of passos; track passo.numero) {
          <div class="passo-item">
            <div class="passo-marker">
              <span class="passo-icon material-icons">{{ passo.icon }}</span>
            </div>

            <div class="passo-card">
              <span class="passo-card-numero">{{ passo.numero }}</span>
              <h3 class="passo-title">{{ passo.title }}</h3>
              <p class="passo-description">{{ passo.description }}</p>
              @if (passo.numero === '01') {
                <app-sisamb-button
                  variant="primary"
                  class="passo-cta"
                  (click)="abrirAgendamento()"
                >
                  Agende aqui
                </app-sisamb-button>
              }
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
