@if (isOpen()) {
  <div class="terms-overlay" (click)="fechar()">
    <div class="terms-dialog" (click)="$event.stopPropagation()">
      <div class="terms-scroll">
        <header class="terms-header">
          <div class="terms-header-text">
            <h3 class="terms-title">Termos de Uso</h3>
            <p class="terms-subtitle">Última atualização: 10 de agosto de 2026</p>
          </div>
          <button
            type="button"
            class="terms-close"
            (click)="fechar()"
            aria-label="Fechar"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </header>

        <div class="terms-body">
          <app-terms-content></app-terms-content>
        </div>

        <footer class="terms-footer">
          <app-button variant="outline" (click)="abrirPaginaDedicada()">
            Abrir em uma página dedicada
          </app-button>
        </footer>
      </div>
    </div>
  </div>
}
