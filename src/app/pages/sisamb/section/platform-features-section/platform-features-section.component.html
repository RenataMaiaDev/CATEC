<section class="platform-features-section" id="sisamb-recursos">
  <div class="section-container text-center">
    <span class="section-badge section-badge--sisamb">Por que o SISAMB</span>
    <h2 class="section-title section-title--sisamb">
      O que muda com o
      <span class="highlight">SISAMB</span>
    </h2>
    <p class="section-subtitle">
      O que muda de verdade na sua secretaria depois da implantação do
      sistema.
    </p>

    <div class="beneficios-network" #grid>
      <div class="network-spine" aria-hidden="true"></div>
      @for (item of beneficios; track item.title) {
        <div class="beneficio-node">
          <span class="node-dot material-icons">{{ item.icon }}</span>
          <div class="node-text">
            <h3>{{ item.title }}</h3>
            <p>{{ item.description }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
