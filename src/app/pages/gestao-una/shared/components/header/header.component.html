<header class="header" [class.menu-open]="isMenuOpen()">
  <div class="header-container">
    <!-- Logo -->
    <a
      href="#gestao-inicio"
      class="logo"
      (click)="setActiveSection('gestao-inicio', $event)"
    >
      <img src="images/logo-gestao-una.webp" alt="Gestão Una" class="logo-img logo-img--invert">
    </a>

    <!-- Desktop navigation menu -->
    <nav class="nav-menu">
      <a
        href="/"
        class="nav-link"
        [class.active]="activeSection() === 'catec'"
        (click)="setActiveSection('catec', $event)"
        >CATEC</a
      >
      <a
        href="#gestao-inicio"
        class="nav-link"
        [class.active]="activeSection() === 'gestao-inicio'"
        (click)="setActiveSection('gestao-inicio', $event)"
        >INÍCIO</a
      >
      <a
        href="#gestao-sobre"
        class="nav-link"
        [class.active]="activeSection() === 'gestao-sobre'"
        (click)="setActiveSection('gestao-sobre', $event)"
        >SOBRE O GESTÃO UNA</a
      >
      <a
        href="#gestao-modulos"
        class="nav-link"
        [class.active]="activeSection() === 'gestao-modulos'"
        (click)="setActiveSection('gestao-modulos', $event)"
        >PRINCIPAIS EIXOS</a
      >
      <a
        href="#gestao-contato"
        class="nav-link"
        [class.active]="activeSection() === 'gestao-contato'"
        (click)="setActiveSection('gestao-contato', $event)"
        >CONTATO</a
      >

      <!-- Gestão Una login link -->
      <a
        href="https://gestaouna.catecsolucoes.com.br/login"
        target="_blank"
        rel="noopener noreferrer"
        class="nav-link"
      >
        <i class="fa-solid fa-right-to-bracket"></i>
        <span>ACESSAR O GESTÃO UNA</span>
      </a>
    </nav>

    <!-- Mobile hamburger button -->
    <button class="hamburger-btn" (click)="toggleMenu()" aria-label="Menu de navegação">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

    <!-- Expanded mobile menu -->
    <div class="mobile-menu">
      <nav class="mobile-nav">
        <a
          href="/"
          class="mobile-link"
          (click)="setActiveSection('catec', $event)"
          >CATEC</a
        >
        <a
          href="#gestao-inicio"
          class="mobile-link"
          (click)="setActiveSection('gestao-inicio', $event)"
          >INÍCIO</a
        >
        <a
          href="#gestao-sobre"
          class="mobile-link"
          (click)="setActiveSection('gestao-sobre', $event)"
          >SOBRE O GESTÃO UNA</a
        >
        <a
          href="#gestao-modulos"
          class="mobile-link"
          (click)="setActiveSection('gestao-modulos', $event)"
          >PRINCIPAIS EIXOS</a
        >
        <a
          href="#gestao-contato"
          class="mobile-link"
          (click)="setActiveSection('gestao-contato', $event)"
          >CONTATO</a
        >

        <!-- Gestão Una login link (mobile, same style) -->
        <a
          href="https://gestaouna.catecsolucoes.com.br/login"
          target="_blank"
          rel="noopener noreferrer"
          class="mobile-link"
        >
          <span>ACESSAR O GESTÃO UNA</span>
          <i class="fa-solid fa-right-to-bracket"></i>
        </a>
      </nav>
    </div>
  </div>
</header>
