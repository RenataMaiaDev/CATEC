<header class="header" [class.menu-open]="isMenuOpen()">
  <div class="header-container">
    <!-- Logo -->
    <a href="#" class="logo" (click)="closeMenu()">
      <img src="img/logo-catec-solucoes.png" alt="CATEC Soluções" class="logo-img">
    </a>

    <!-- Desktop navigation menu -->
    <nav class="nav-menu">
      <a href="#inicio" class="nav-link active">INÍCIO</a>
      <a href="#quem-somos" class="nav-link">QUEM SOMOS</a>
      <a href="#produto" class="nav-link">PRODUTO</a>
      <a href="#outros-servicos" class="nav-link">OUTROS SERVIÇOS</a>
      <a href="#contato" class="nav-link">CONTATO</a>

      <!-- Useful-links dropdown -->
      <div class="dropdown-container" [class.open]="isDropdownOpen()">
        <button class="nav-link dropdown-toggle" (click)="toggleDropdown($event)">
          LINKS ÚTEIS
          <i class="fa-solid fa-chevron-down arrow-icon"></i>
        </button>
        <div class="dropdown-menu">
          <a href="#portal" class="dropdown-item" (click)="closeMenu()">Portal do Cliente</a>
          <a href="#suporte" class="dropdown-item" (click)="closeMenu()">Suporte Técnico</a>
          <a href="#transparencia" class="dropdown-item" (click)="closeMenu()">Portal da Transparência</a>
        </div>
      </div>
    </nav>

    <!-- Mobile hamburger button -->
    <button class="hamburger-btn" (click)="toggleMenu()" aria-label="Menu de navegação">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

    <!-- Expanded mobile menu -->
    <div class="mobile-menu">
      <nav class="mobile-nav">
        <a href="#inicio" class="mobile-link" (click)="closeMenu()">INÍCIO</a>
        <a href="#quem-somos" class="mobile-link" (click)="closeMenu()">QUEM SOMOS</a>
        <a href="#produto" class="mobile-link" (click)="closeMenu()">PRODUTO</a>
        <a href="#outros-servicos" class="mobile-link" (click)="closeMenu()">OUTROS SERVIÇOS</a>
        <a href="#contato" class="mobile-link" (click)="closeMenu()">CONTATO</a>

        <div class="mobile-dropdown" [class.open]="isDropdownOpen()">
          <button class="mobile-link mobile-dropdown-toggle" (click)="toggleDropdown($event)">
            LINKS ÚTEIS <i class="fa-solid fa-chevron-down arrow-icon"></i>
          </button>
          <div class="mobile-dropdown-menu">
            <a href="#portal" class="mobile-dropdown-item" (click)="closeMenu()">Portal do Cliente</a>
            <a href="#suporte" class="mobile-dropdown-item" (click)="closeMenu()">Suporte Técnico</a>
            <a href="#transparencia" class="mobile-dropdown-item" (click)="closeMenu()">Portal da Transparência</a>
          </div>
        </div>
      </nav>
    </div>
  </div>
</header>
