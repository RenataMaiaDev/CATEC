<section class="problema-section" id="sisamb-problema">
  <div class="section-container text-center">
    <span class="section-badge section-badge--sisamb">Sem o SISAMB</span>
    <h2 class="section-title section-title--sisamb">
      Esses gargalos ainda atrasam
      <span class="highlight">a sua secretaria?</span>
    </h2>
    <p class="section-subtitle">
      Burocracia em papel, filas presenciais e tarefas repetidas atrasam a
      gestão ambiental em municípios de todo o país.
    </p>

    <div class="dores-grid" #grid>
      @for (dor of dores; track dor.title) {
        <app-card icon="close" [title]="dor.title" [description]="dor.description" />
      }
    </div>
  </div>
</section>
