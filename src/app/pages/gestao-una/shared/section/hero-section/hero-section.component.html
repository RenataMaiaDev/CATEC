<section class="hero-section" id="gestao-inicio">
  <div class="hero-container">
    <!-- Left side: Text and CTA -->
    <div class="hero-content">
      <h1 class="hero-title">
        Gestão eficiente para todas as suas instituições, <br />
        <span class="highlight">em um só lugar</span>
      </h1>
      <p class="hero-subtitle">
        Fazendo gestão de maneira prática, inteligente, barata, inclusiva e
        moderna.
      </p>

      <div class="hero-actions">
        <app-gestao-button variant="primary" (click)="abrirWhatsApp()">
          Fale Conosco <i class="fa-solid fa-arrow-right"></i>
        </app-gestao-button>
      </div>
    </div>

    <!-- Right side: real product screenshot -->
    <div class="hero-visual">
      <img
        src="Images-gu/hero-gu.png"
        alt="Painel do Gestão Una em laptop e celular"
        class="hero-visual-img"
      />
    </div>
  </div>

  <!-- Organic transition into the next (light) section -->
  <svg class="hero-wave" viewBox="0 0 1440 90" preserveAspectRatio="none" aria-hidden="true">
    <path
      d="M0,45 C320,90 480,0 800,40 C1080,74 1260,10 1440,45 L1440,90 L0,90 Z"
      fill="#fffefe"
    ></path>
  </svg>
</section>
